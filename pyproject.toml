[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-printfriendly"
version = "0.1.0"
description = "LangChain integration for the PrintFriendly API: load any web page as clean, ad-free Markdown."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PrintFriendly" }]
keywords = [
    "langchain",
    "printfriendly",
    "document-loader",
    "web-scraping",
    "markdown",
    "rag",
    "llm",
    "agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.urls]
Homepage = "https://www.printfriendly.com/api"
Documentation = "https://github.com/printfriendly/langchain-printfriendly#readme"
Repository = "https://github.com/printfriendly/langchain-printfriendly"
Issues = "https://github.com/printfriendly/langchain-printfriendly/issues"
Changelog = "https://github.com/printfriendly/langchain-printfriendly/blob/main/CHANGELOG.md"
"API reference" = "https://www.printfriendly.com/openapi.json"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "respx>=0.22",
    "langchain-tests>=1.0.0,<2.0.0",
]
lint = [
    "ruff>=0.8",
    "mypy>=1.13",
    "codespell>=2.3",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_printfriendly"]

[tool.hatch.build.targets.sdist]
include = [
    "langchain_printfriendly",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T201", "D"]
ignore = ["D203", "D213", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls the real PrintFriendly API and uses documents from the key's plan (opt-in, needs PRINTFRIENDLY_API_KEY)",
]

[tool.codespell]
skip = "uv.lock,.venv,.git,dist"
